<header class="app-header">
  <div class="header-right">
    <button type="button" class="btn-icon d-lg-none" (click)="toggleSidebar.emit()" aria-label="فتح القائمة">
      <app-icon-placeholder size="lg" />
    </button>
    <app-header-search-bar />
  </div>
  <div class="header-left">
    <button type="button" class="btn-icon position-relative" aria-label="الإشعارات">
      <app-icon-placeholder size="md" src="/assets/images/svg/Header/notification.svg" />
      <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle" style="margin-inline-start:-10px;margin-top:10px">
        <span class="visually-hidden">إشعارات جديدة</span>
      </span>
    </button>
    <div class="position-relative">
      <button type="button" class="header-profile-btn" (click)="toggleMenu()" aria-haspopup="menu" [attr.aria-expanded]="menuOpen()" aria-label="قائمة المستخدم">
        <app-icon-placeholder size="md" src="/assets/images/svg/Header/user.svg" />
      </button>
      @if (menuOpen()) {
        <div class="dropdown-menu dropdown-menu-end show" style="position:absolute;inset-inline-end:0;top:calc(100% + 6px);min-width:180px">
          <button type="button" class="dropdown-item"><app-icon-placeholder size="sm" /> الملف الشخصي</button>
          <button type="button" class="dropdown-item"><app-icon-placeholder size="sm" /> الإعدادات</button>
          <hr class="dropdown-divider" />
          <button type="button" class="dropdown-item text-danger"><app-icon-placeholder size="sm" /> تسجيل الخروج</button>
        </div>
      }
    </div>
  </div>
</header>
