<div class="donut-layout">
  <div class="donut-visual">
    <svg [attr.width]="size" [attr.height]="size" [attr.viewBox]="'0 0 ' + size + ' ' + size" class="donut-svg" role="img" aria-label="الطلبات حسب المنتج">
      <g [attr.transform]="'rotate(-90 ' + size/2 + ' ' + size/2 + ')'">
        <circle [attr.cx]="size/2" [attr.cy]="size/2" [attr.r]="r()" fill="none" [attr.stroke-width]="stroke" class="donut-track" />
        @for (seg of segments(); track seg.label) {
          <circle
            [attr.cx]="size/2" [attr.cy]="size/2" [attr.r]="r()" fill="none"
            [attr.stroke]="seg.color" [attr.stroke-width]="stroke"
            [attr.stroke-dasharray]="seg.dash" [attr.stroke-dashoffset]="seg.offset"
            stroke-linecap="round"
            class="donut-seg"
            [class.donut-seg--teal]="seg.tone === 'teal'"
            [class.donut-seg--mint]="seg.tone === 'mint'"
            [class.donut-seg--gold]="seg.tone === 'gold'"
          >
            <title>{{ seg.label }}: {{ seg.percent }}%</title>
          </circle>
        }
      </g>
      <text [attr.x]="size/2" [attr.y]="size/2 - 2" text-anchor="middle" class="donut-total">{{ total() }}</text>
      <text [attr.x]="size/2" [attr.y]="size/2 + 16" text-anchor="middle" class="donut-sub">الإجمالي</text>
    </svg>
  </div>
  <div class="donut-legend">
    @for (item of items(); track item.label) {
      <div class="legend-row">
        <span class="legend-label">{{ item.label }}</span>
        <app-status-badge [label]="item.percent + '%'" [tone]="badgeTone(item.tone)" />
      </div>
    }
  </div>
</div>
