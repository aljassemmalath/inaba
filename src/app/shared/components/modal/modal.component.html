<div class="app-modal" [class.app-modal--center]="modalType() === 'center'" [style.width]="width">
  <div class="app-modal__bg" aria-hidden="true">
    @if (showPattern()) { <div class="app-modal__pattern"></div> }
  </div>

  @if (showCloseButton()) {
    <button
      type="button"
      class="app-modal__close"
      [class.app-modal__close--corner]="modalType() === 'center'"
      (click)="close()"
      aria-label="إغلاق"
    >
      <app-icon-placeholder size="md" />
    </button>
  }

  <header
    class="app-modal__header"
    [class.app-modal__header--right]="modalType() === 'right'"
    [class.app-modal__header--center]="modalType() === 'center'"
  >
    @if (modalType() === 'center') {
      <span class="app-modal__icon-circle">
        <app-icon-placeholder size="lg" [src]="userIcon" />
      </span>
    }
    <div class="app-modal__header-main">
      @if (modalType() === 'right') {
        <span class="app-modal__icon-circle">
          <app-icon-placeholder size="lg" [src]="userIcon" />
        </span>
      }
      <div class="app-modal__titles">
        @if (title()) { <h2 class="app-modal__title" [class.app-modal__title--center]="modalType() === 'center'">{{ title() }}</h2> }
        @if (description()) { <p class="app-modal__desc" [class.app-modal__desc--center]="modalType() === 'center'">{{ description() }}</p> }
        <ng-content select="[modal-subtitle]" />
      </div>
    </div>
  </header>

  <div
    class="app-modal__body"
    [class.app-modal__body--right]="modalType() === 'right'"
    [class.app-modal__body--center]="modalType() === 'center'"
  >
    <ng-content select="[modal-body]" />
    <ng-content />
  </div>

  <div
    class="app-modal__footer"
    [class.app-modal__footer--right]="modalType() === 'right'"
    [class.app-modal__actions]="modalType() === 'center'"
    [style.display]="modalType() === 'right' && !showFooter() ? 'none' : null"
  >
    <ng-content select="[modal-actions]" />
    <ng-content select="[modal-footer]" />
  </div>
</div>
