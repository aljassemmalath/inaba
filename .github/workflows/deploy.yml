
name: Deploy Inaba to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npx ng build --base-href /inaba/

      - name: Prepare website
        run: |
          if [ -f dist/inaba-portal/browser/index.html ]; then
            PUBLISH_DIR="dist/inaba-portal/browser"
          elif [ -f dist/inaba-portal/index.html ]; then
            PUBLISH_DIR="dist/inaba-portal"
          else
            echo "Angular build output not found"
            find dist -name index.html
            exit 1
          fi

          cp "$PUBLISH_DIR/index.html" "$PUBLISH_DIR/404.html"
          echo "PUBLISH_DIR=$PUBLISH_DIR" >> "$GITHUB_ENV"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
